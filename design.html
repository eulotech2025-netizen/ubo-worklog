<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>화면 느낌 고르기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 화면 느낌 고르기 (톤앤매너 시안) — 화면에서 열면 바꿔 보기, 인쇄하면 A4 가로 9장.
   설계: docs/superpowers/specs/2026-10-01-tone-manner-options-design.md
   문서 바탕은 중립 회색 — 어느 시안 색도 편들지 않는다. 종이는 늘 흰색. */
:root{
  --desk:#E4E7EB;--chrome:#FFFFFF;--chrome-ink:#1B2430;--chrome-sub:#5F6B7A;--chrome-rule:#D5DBE3;--chrome-on:#1B2430;--chrome-on-ink:#FFFFFF;
  --ink:#1B2430;--sub:#5F6B7A;--mute:#9AA4B1;--rule:#CDD3DB;--faint:#F3F5F7;
}
@media screen and (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark;--desk:#14181D;--chrome:#1C2128;--chrome-ink:#E6EAF0;--chrome-sub:#9AA5B3;--chrome-rule:#2E3640;--chrome-on:#E6EAF0;--chrome-on-ink:#14181D}
}
:root[data-theme="dark"]{color-scheme:dark;--desk:#14181D;--chrome:#1C2128;--chrome-ink:#E6EAF0;--chrome-sub:#9AA5B3;--chrome-rule:#2E3640;--chrome-on:#E6EAF0;--chrome-on-ink:#14181D}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--desk);color:var(--chrome-ink);font-family:'IBM Plex Sans KR','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;font-size:14px;line-height:1.5}

/* ── 바꿔 보기 (화면 전용) ───────────────────────────────────────────── */
.panel{background:var(--chrome);border-bottom:1px solid var(--chrome-rule);padding:14px 16px;display:grid;gap:10px}
.panel-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.panel h1{margin:0;font-family:'Gothic A1','IBM Plex Sans KR',sans-serif;font-weight:800;font-size:20px}
.panel .hint{margin:0;color:var(--chrome-sub);font-size:13px}
.panel .print{margin-left:auto;border:1px solid var(--chrome-on);background:var(--chrome-on);color:var(--chrome-on-ink);border-radius:8px;padding:7px 14px;font:inherit;font-weight:600;cursor:pointer}
.ctl{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.grp{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-width:0}
.grp>span{font-size:12.5px;color:var(--chrome-sub);white-space:nowrap}
.seg{display:inline-flex;flex-wrap:wrap;max-width:100%;border:1px solid var(--chrome-rule);border-radius:8px;overflow:hidden}
.seg button{border:0;border-left:1px solid var(--chrome-rule);background:transparent;color:var(--chrome-ink);padding:5px 10px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--chrome-on);color:var(--chrome-on-ink);font-weight:600}
.seg button:focus-visible,.panel .print:focus-visible{outline:2px solid #5FA8FF;outline-offset:1px}
.presets .seg button{padding:6px 14px;font-size:14px}
.now{font-size:13px;color:var(--chrome-sub)}
.now b{color:var(--chrome-ink)}
.desk{padding:16px;display:grid;gap:16px;justify-items:center}
.live{width:100%;max-width:1400px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start}
.live-pc{min-width:0}
@media (max-width:900px){.live{grid-template-columns:minmax(0,1fr)}.live-ph{justify-self:center}}
.desk-h{margin:12px 0 0;font-size:15px;color:var(--chrome-sub);font-weight:600;justify-self:start;max-width:1400px;width:100%}

/* ── 그림 틀 — 실제 크기로 그리고 zoom 으로 줄인다.
   transform: scale 은 인쇄 때 줄이기 전 크기로 종이 끝에서 잘린다 (크롬, 10-01 확인) ── */
.frame{position:relative;overflow:hidden;flex:none}
.frame-in{position:absolute;top:0;left:0}

/* ── 그림 (UI) — 항목 값은 data-* → 변수 ─────────────────────────────── */
.ui{--u-ff:"Noto Sans KR","Malgun Gothic",sans-serif;--u-fs:14px;--u-row:36px;--u-pad:10px;--u-gap:10px;--u-ctl:32px;--u-r:6px;--u-rp:6px;--u-rc:8px;
  position:relative;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;
  font-family:var(--u-ff);font-size:var(--u-fs);line-height:1.35;color:var(--u-ink);background:var(--u-bg);font-variant-numeric:tabular-nums;letter-spacing:0;text-align:left}
.ui *{box-sizing:border-box}
.ui[data-font="dotum"]{--u-ff:"Dotum","돋움","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif}
.ui[data-font="malgun"]{--u-ff:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif}
.ui[data-font="noto"]{--u-ff:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif}
.ui[data-size="s"]{--u-fs:13px}
.ui[data-size="m"]{--u-fs:14px}
.ui[data-size="l"]{--u-fs:16px}
.ui[data-density="tight"]{--u-row:28px;--u-pad:6px;--u-gap:6px;--u-ctl:24px}
.ui[data-density="normal"]{--u-row:36px;--u-pad:10px;--u-gap:10px;--u-ctl:32px}
.ui[data-density="loose"]{--u-row:48px;--u-pad:14px;--u-gap:14px;--u-ctl:42px}
.ui[data-radius="sharp"]{--u-r:2px;--u-rp:2px;--u-rc:2px}
.ui[data-radius="soft"]{--u-r:6px;--u-rp:6px;--u-rc:8px}
.ui[data-radius="round"]{--u-r:12px;--u-rp:999px;--u-rc:16px}

/* 색 셋 — 상태 알약 다섯(완료 · 진행 · 검수 · 대기 · 지연) 포함 */
.ui[data-color="blue"]{--u-bg:#F7F8F9;--u-surface:#FFFFFF;--u-panel:#F4F6F9;--u-line:#D9DDE3;--u-line2:#C3C9D1;--u-head:#F1F3F6;--u-head-ink:#222831;--u-ink:#111418;--u-sub:#646B74;
  --u-pri:#2B4BD8;--u-pri-ink:#FFFFFF;--u-bar:#2B4BD8;--u-bar-ink:#FFFFFF;--u-nav:#FFFFFF;--u-nav-ink:#222831;--u-nav-on:#2B4BD8;--u-link:#2443C4;--u-acc:#2B4BD8;--u-ok:#1E7B3A;
  --u-zebra:#F4F6F9;--u-warn-bg:#FFF4E5;--u-warn-ink:#A44A00;--u-warn-line:#F5C98A;
  --s-done-bg:#E6F4EA;--s-done:#1E7B3A;--s-doing-bg:#E8EDFF;--s-doing:#2443C4;--s-check-bg:#F1E9FF;--s-check:#6A3DC0;--s-wait-bg:#EEF0F3;--s-wait:#4D545C;--s-late-bg:#FDE7E7;--s-late:#C62828}
.ui[data-color="navy"]{--u-bg:#F2F4F7;--u-surface:#FFFFFF;--u-panel:#FFFFFF;--u-line:#E3E7ED;--u-line2:#CDD4DD;--u-head:#F7F9FB;--u-head-ink:#5B6675;--u-ink:#1B2430;--u-sub:#6B7685;
  --u-pri:#1E3A5F;--u-pri-ink:#FFFFFF;--u-bar:#FFFFFF;--u-bar-ink:#1E3A5F;--u-nav:#1E3A5F;--u-nav-ink:#E8EEF5;--u-nav-on:#3FC7B0;--u-link:#0E7C6B;--u-acc:#0E8A78;--u-ok:#0B6B5C;
  --u-zebra:#F6F8FA;--u-warn-bg:#FFF6E0;--u-warn-ink:#8A5300;--u-warn-line:#F1D08A;
  --s-done-bg:#DDF1EC;--s-done:#0B6B5C;--s-doing-bg:#E3ECF7;--s-doing:#1E3A5F;--s-check-bg:#ECE8F7;--s-check:#5B47A8;--s-wait-bg:#EEF1F4;--s-wait:#5B6675;--s-late-bg:#FBE4E1;--s-late:#B3261E}
.ui[data-color="contrast"]{--u-bg:#FFFFFF;--u-surface:#FFFFFF;--u-panel:#FFFFFF;--u-line:#A3AAB3;--u-line2:#4B5563;--u-head:#111827;--u-head-ink:#FFFFFF;--u-ink:#0B0F14;--u-sub:#374151;
  --u-pri:#C2410C;--u-pri-ink:#FFFFFF;--u-bar:#111827;--u-bar-ink:#FFFFFF;--u-nav:#0B0F14;--u-nav-ink:#FFFFFF;--u-nav-on:#F97316;--u-link:#C2410C;--u-acc:#EA580C;--u-ok:#15803D;
  --u-zebra:#F0F1F3;--u-warn-bg:#FFEDD5;--u-warn-ink:#9A3412;--u-warn-line:#FB923C;
  --s-done-bg:#15803D;--s-done:#FFFFFF;--s-doing-bg:#1D4ED8;--s-doing:#FFFFFF;--s-check-bg:#6D28D9;--s-check:#FFFFFF;--s-wait-bg:#4B5563;--s-wait:#FFFFFF;--s-late-bg:#DC2626;--s-late:#FFFFFF}

.u-pill{display:inline-flex;align-items:center;height:1.75em;padding:0 .65em;border-radius:var(--u-rp);font-size:.82em;font-weight:700;white-space:nowrap;flex:none}
.s-done{background:var(--s-done-bg);color:var(--s-done)}.s-doing{background:var(--s-doing-bg);color:var(--s-doing)}.s-check{background:var(--s-check-bg);color:var(--s-check)}
.s-wait{background:var(--s-wait-bg);color:var(--s-wait)}.s-late{background:var(--s-late-bg);color:var(--s-late)}
.u-btn{display:inline-flex;align-items:center;justify-content:center;gap:2px;height:var(--u-ctl);padding:0 calc(var(--u-pad) + 4px);border:1px solid var(--u-line2);border-radius:var(--u-r);background:var(--u-surface);color:var(--u-ink);font-size:.95em;white-space:nowrap;flex:none}
.u-btn.pri{background:var(--u-pri);border-color:var(--u-pri);color:var(--u-pri-ink);font-weight:700}
.u-btn kbd{font:inherit;font-size:.86em;opacity:.85}
.u-btn.big{height:52px;min-width:150px;padding:0 22px;font-size:1.08em;font-weight:700}
.ui[data-color="contrast"] .u-btn:not(.pri){border-width:1.5px;font-weight:500}
.u-sp{flex:1}
.u-ic{display:inline-block;width:.95em;height:.95em;flex:none;color:var(--u-sub)}

/* PC — 메뉴줄 · 창 · 칸 · 표 · 합계 · 안내 · 버튼 */
.u-nav{flex:none;display:flex;align-items:center;gap:calc(var(--u-gap) * 2.2);height:calc(var(--u-row) + 14px);padding:0 18px;background:var(--u-nav);color:var(--u-nav-ink);border-bottom:1px solid var(--u-line)}
.u-logo{font-weight:700;font-size:1.08em;white-space:nowrap}
.ui[data-color="blue"] .u-logo{color:var(--u-pri)}
.u-menu{display:flex;gap:calc(var(--u-gap) * 1.8);align-self:stretch}
.u-menu span{display:flex;align-items:center;padding-top:3px;border-bottom:3px solid transparent;white-space:nowrap}
.u-menu .on{border-bottom-color:var(--u-nav-on);font-weight:700}
.u-user{margin-left:auto;font-size:.9em;opacity:.85;white-space:nowrap}
.u-body{flex:1;min-height:0;display:flex;flex-direction:column;padding:var(--u-gap)}
.u-win{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--u-surface);border:1px solid var(--u-line);border-radius:var(--u-rc);overflow:hidden}
.ui[data-color="contrast"] .u-win{border:2px solid var(--u-ink)}
.u-winbar{display:none;flex:none;align-items:center;gap:10px;height:28px;padding:0 10px;background:var(--u-bar);color:var(--u-bar-ink);font-size:12px}
.ui[data-color="blue"] .u-winbar{display:flex}
.u-winbar .ico{margin-left:auto;letter-spacing:6px;opacity:.9}
.u-head{flex:none;display:flex;align-items:center;gap:var(--u-gap);padding:calc(var(--u-pad) + 2px) calc(var(--u-pad) + 6px)}
.u-title{font-size:1.32em;font-weight:700;white-space:nowrap}
.u-saved{font-size:.86em;color:var(--u-ok);white-space:nowrap}
.u-form{flex:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--u-gap) calc(var(--u-gap) * 2);margin:0 calc(var(--u-pad) + 6px);padding:var(--u-pad) calc(var(--u-pad) + 4px);background:var(--u-panel);border-radius:var(--u-rc)}
.ui[data-color="blue"] .u-form{border:1px solid var(--u-line)}
.ui[data-color="navy"] .u-form,.ui[data-color="contrast"] .u-form{padding-left:0;padding-right:0}
.u-f{display:flex;align-items:center;gap:8px;min-width:0}
.u-l{flex:none;width:4.6em;color:var(--u-sub);white-space:nowrap}
.u-in{flex:1;min-width:0;display:flex;align-items:center;gap:6px;height:var(--u-ctl);padding:0 9px;border:1px solid var(--u-line2);border-radius:var(--u-r);background:#FFFFFF;white-space:nowrap;overflow:hidden}
.u-in .u-ic{margin-left:auto}
.ui[data-color="contrast"] .u-in{border:1.5px solid var(--u-line2)}
.u-tools{flex:none;display:flex;align-items:center;gap:6px;padding:var(--u-pad) calc(var(--u-pad) + 6px) calc(var(--u-pad) * .6)}
.u-tools .u-btn{height:calc(var(--u-ctl) - 2px);font-size:.9em}
.u-count{font-size:.86em;color:var(--u-sub)}
.u-tablewrap{position:relative;flex:1;min-height:0;overflow:hidden;margin:0 calc(var(--u-pad) + 6px)}
.u-table{width:100%;border-collapse:collapse;table-layout:fixed}
.u-table th,.u-table td{height:var(--u-row);padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;vertical-align:middle}
.u-table th{font-weight:700;font-size:.92em}
.u-table .n{text-align:right}
.u-table .c{text-align:center}
.u-table .no{text-align:center;color:var(--u-sub);font-size:.84em;padding:0}
.u-table .add{color:var(--u-link);font-size:.92em}
.ui[data-table="grid"] .u-table th{background:var(--u-head);color:var(--u-head-ink)}
.ui[data-table="grid"] .u-table th,.ui[data-table="grid"] .u-table td{border:1px solid var(--u-line)}
.ui[data-table="grid"] .u-table .no span{display:inline-block;min-width:1.7em;border:1px solid var(--u-line2);border-radius:var(--u-r);line-height:1.4}
.ui[data-table="lines"] .u-table th{background:transparent;color:var(--u-sub);border-bottom:1.5px solid var(--u-line2)}
.ui[data-table="lines"] .u-table td{border-bottom:1px solid var(--u-line)}
.ui[data-table="zebra"] .u-table th{background:var(--u-head);color:var(--u-head-ink)}
.ui[data-table="zebra"] .u-table tbody tr:nth-child(even) td{background:var(--u-zebra)}
.u-more{position:absolute;left:0;right:0;bottom:0;padding:22px 0 5px;text-align:center;font-size:.86em;font-weight:700;color:var(--u-sub);background:linear-gradient(to bottom,transparent,var(--u-surface) 60%)}
.u-more[hidden]{display:none}
.u-sum{flex:none;display:flex;justify-content:flex-end;align-items:baseline;gap:calc(var(--u-gap) * 2.2);margin:0 calc(var(--u-pad) + 6px);padding:calc(var(--u-pad) * .8) 8px;border-top:1.5px solid var(--u-line2)}
.u-sum span{color:var(--u-sub);font-size:.9em}
.u-sum b{color:var(--u-ink);margin-left:6px;font-size:1.04em}
.u-sum .grand b{font-size:1.2em}
.u-note{flex:none;display:flex;align-items:center;gap:8px;margin:calc(var(--u-pad) * .6) calc(var(--u-pad) + 6px) var(--u-pad);padding:calc(var(--u-pad) * .55) 10px;background:var(--u-warn-bg);color:var(--u-warn-ink);border:1px solid var(--u-warn-line);border-radius:var(--u-r);font-size:.92em}
.u-actions{flex:none;display:flex;align-items:center;gap:6px;padding:var(--u-pad) calc(var(--u-pad) + 6px);border-top:1px solid var(--u-line);background:var(--u-panel)}
.u-actions.big{gap:10px;padding:12px 16px;background:var(--u-surface);border-top:2px solid var(--u-line2)}

/* 휴대폰 — 출고 요청함 */
.ph{border:8px solid #1D2026;border-radius:30px}
.p-status{flex:none;height:22px;display:flex;justify-content:space-between;align-items:center;padding:0 16px;font-size:11px;background:var(--u-nav);color:var(--u-nav-ink)}
.p-bar{flex:none;display:flex;align-items:center;gap:8px;padding:calc(var(--u-pad) + 2px) 14px;background:var(--u-nav);color:var(--u-nav-ink);border-bottom:1px solid var(--u-line)}
.p-bar b{font-size:1.14em;white-space:nowrap}
.p-cnt{display:inline-flex;align-items:center;justify-content:center;min-width:1.6em;height:1.6em;padding:0 .4em;border-radius:999px;background:var(--u-acc);color:#FFFFFF;font-size:.8em;font-weight:700}
.p-who{margin-left:auto;font-size:.82em;opacity:.85;white-space:nowrap}
.p-chips{flex:none;display:flex;gap:6px;padding:var(--u-pad) 12px;overflow:hidden;background:var(--u-surface);border-bottom:1px solid var(--u-line)}
.p-chips span{display:inline-flex;align-items:center;height:calc(var(--u-ctl) - 4px);padding:0 10px;border:1px solid var(--u-line2);border-radius:var(--u-rp);font-size:.86em;white-space:nowrap;flex:none}
.p-chips .on{background:var(--u-pri);border-color:var(--u-pri);color:var(--u-pri-ink);font-weight:700}
.p-list{position:relative;flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:var(--u-gap);padding:var(--u-gap) 10px}
.p-list .u-more{background:linear-gradient(to bottom,transparent,var(--u-bg) 60%)}
.p-card{flex:none;display:flex;flex-direction:column;gap:calc(var(--u-gap) * .45);padding:var(--u-pad) 12px;background:var(--u-surface);border:1px solid var(--u-line);border-radius:var(--u-rc)}
.ui[data-color="contrast"] .p-card{border:1.5px solid var(--u-line2)}
.p-top{display:flex;align-items:center;gap:8px}
.p-time{color:var(--u-sub);font-size:.9em;white-space:nowrap}
.p-link{margin-left:auto;color:var(--u-link);font-weight:700;font-size:.92em;white-space:nowrap}
.p-cust{display:flex;align-items:center;gap:6px;min-width:0}
.p-cust b{font-size:1.04em;white-space:nowrap}
.p-co{font-size:.78em;color:var(--u-sub);border:1px solid var(--u-line);padding:0 5px;border-radius:var(--u-rp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-items,.p-wh{color:var(--u-sub);font-size:.92em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-act{display:flex;justify-content:flex-end;gap:6px}
.p-act .u-btn{height:calc(var(--u-ctl) - 2px);font-size:.9em}
.p-card .u-btn.big{width:100%;height:46px;min-width:0}
.p-done{color:var(--u-ok);font-size:.88em;font-weight:700}
.p-tabs{flex:none;display:flex;justify-content:space-around;align-items:center;height:48px;border-top:1px solid var(--u-line);background:var(--u-surface);font-size:.8em;color:var(--u-sub)}
.p-tabs .on{color:var(--u-acc);font-weight:700}

/* 작은 그림 (항목별 장) */
.mini{padding:6px;background:var(--u-surface)}
.mini .u-tablewrap{margin:0}
.mini.ctl{gap:var(--u-gap);padding:12px;justify-content:center;align-items:flex-start}
.m-row{display:flex;align-items:center;gap:8px}
.mini.ctl .u-in{flex:none;width:160px}
.mini.ctl .p-card{max-width:100%;align-self:flex-start}

/* ── 종이 ─────────────────────────────────────────────────────────────── */
#pages{display:grid;gap:10mm;justify-items:center}
.sheet{width:297mm;height:210mm;padding:9mm;background:#FFFFFF;color:var(--ink);position:relative;overflow:hidden;display:flex;flex-direction:column;gap:3mm;
  font-size:10pt;line-height:1.45;word-break:keep-all;box-shadow:0 1px 3px rgba(0,0,0,.12),0 10px 28px rgba(0,0,0,.10)}
.sheet h2{margin:0;font-family:'Gothic A1','IBM Plex Sans KR',sans-serif;font-weight:800;font-size:17pt;line-height:1.2;letter-spacing:-.01em}
.sheet .lede{margin:0;color:var(--sub);font-size:10pt}
.pgno,.ex{position:absolute;bottom:4.5mm;font-size:8pt;color:var(--mute)}
.pgno{right:9mm}.ex{left:9mm}
.cb{display:inline-block;width:3.4mm;height:3.4mm;border:1.2px solid var(--ink);border-radius:.6mm;vertical-align:-.6mm;margin-right:1.2mm;background:#FFFFFF;flex:none}
.wl{border-bottom:1px solid var(--rule);height:6.2mm}

/* 1쪽 */
.cover{gap:6mm}
.eyebrow{margin:0;font-size:9pt;color:var(--sub);letter-spacing:.04em}
.cover h1{margin:1mm 0 0;font-family:'Gothic A1','IBM Plex Sans KR',sans-serif;font-weight:800;font-size:30pt;line-height:1.1}
.cover .lede{font-size:11.5pt;max-width:200mm}
.asks{display:grid;grid-template-columns:repeat(3,1fr);gap:5mm}
.asks div{border-top:2px solid var(--ink);padding-top:2mm}
.asks b{display:block;font-size:11.5pt}
.asks span{color:var(--sub);font-size:9.5pt}
.thumbs{display:flex;gap:7mm;justify-content:flex-start}
.thumbs figure{margin:0;display:grid;gap:1.5mm}
.thumbs .frame{border:1px solid var(--rule)}
.thumbs figcaption{font-size:10pt}
.thumbs figcaption b{font-family:'Gothic A1',sans-serif;font-weight:800;margin-right:1.5mm}
.order{display:grid;grid-template-columns:repeat(4,1fr);gap:4mm;margin:0;padding:0;list-style:none}
.order li{background:var(--faint);padding:2.5mm 3mm;border-radius:1.5mm;font-size:9.5pt}
.order b{display:block;font-size:10.5pt}
.cover .note{margin:0;color:var(--sub);font-size:9pt}

/* 2~4쪽 */
.p-head{display:flex;align-items:center;gap:4mm}
.p-letter{font-family:'Gothic A1',sans-serif;font-weight:800;font-size:30pt;line-height:1;width:13mm;height:13mm;display:grid;place-items:center;border:1.5px solid var(--ink);border-radius:2mm;flex:none}
.p-head h2{font-size:18pt}
.p-head .lede{font-size:10pt}
.chips{display:flex;flex-wrap:wrap;gap:1.5mm;margin:0;padding:0;list-style:none}
.chips li{font-size:8.5pt;border:1px solid var(--rule);border-radius:1mm;padding:.3mm 2mm;white-space:nowrap}
.chips li span{color:var(--sub);margin-right:1mm}
.p-body{flex:1;min-height:0;display:grid;grid-template-columns:auto 1fr;gap:5mm}
.p-body figure{margin:0;display:grid;gap:1.2mm;align-content:start}
.p-body figcaption,.cap{font-size:8.5pt;color:var(--sub)}
.p-right{display:grid;gap:4mm;align-content:start;justify-items:start}
.opinion{width:100%;border:1px solid var(--rule);border-radius:1.5mm;padding:3mm;display:grid;gap:1mm}
.opinion .op-h{font-weight:600;font-size:10.5pt}
.op-pick{display:flex;gap:5mm;font-size:10pt;margin:1mm 0 1.5mm}
.op-l{font-size:9pt;color:var(--sub);margin-top:1mm}

/* 5~7쪽 */
.a-head{display:grid;gap:1mm}
.axis{display:grid;gap:1.6mm}
.axis-h{display:flex;align-items:baseline;gap:3mm;border-top:1.5px solid var(--ink);padding-top:1.6mm}
.axis-h b{font-size:12pt}
.axis-h span{color:var(--sub);font-size:9.5pt}
.axis-h small{margin-left:auto;font-size:8.5pt;color:var(--mute)}
.axis-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:5mm}
.opt{margin:0;display:grid;gap:1.4mm;align-content:start}
.opt .frame{border:1px solid var(--rule)}
.opt figcaption{display:flex;align-items:center;gap:2mm;font-size:9pt}
.opt figcaption b{font-size:10pt}
.opt figcaption .tag{font-size:7.5pt;color:var(--sub);border:1px solid var(--rule);border-radius:1mm;padding:0 1.2mm;font-style:normal}
.opt figcaption .pick{margin-left:auto;white-space:nowrap}
.keys{border:1px solid var(--rule);border-radius:1.5mm;padding:3mm 4mm;display:flex;flex-wrap:wrap;align-items:center;gap:2mm 6mm;font-size:10pt}
.keys b{font-size:11pt}

/* 8~9쪽 */
.t{width:100%;border-collapse:collapse;font-size:9.5pt}
.t th,.t td{border:1px solid var(--rule);padding:1.6mm 2.4mm;text-align:left;vertical-align:middle}
.t th{background:var(--faint);font-weight:600;font-size:9pt}
.t td.big{font-size:11pt;font-weight:600}
.t .pk{white-space:nowrap;font-size:9pt}
.t .pk span{margin-right:3mm}
.keep{margin:0;font-size:9.5pt;color:var(--sub)}
.keep b{color:var(--ink)}
.vote td{height:11.5mm}
.vote th small{display:block;font-weight:400;color:var(--sub);font-size:7.5pt}
.wrap-up{border:1.5px solid var(--ink);border-radius:1.5mm;padding:3mm 4mm;display:grid;grid-template-columns:repeat(3,1fr);gap:3mm 6mm;font-size:10pt}
.wrap-up b{grid-column:1 / -1;font-size:11pt}
.wrap-up span{border-bottom:1px solid var(--rule);padding-bottom:1mm;color:var(--sub)}

const full = s => ({ ...SAY, ...s });

// 실제 크기(w × h)로 그리고 scale 로 줄인 틀
// data-fw/fh/fs 는 좁은 화면에서 종이 그림을 다시 맞출 때(refitSheets) 쓰는 원래 크기
function frame(inner, w, h, scale) {
  return `<div class="frame" data-fw="${w}" data-fh="${h}" data-fs="${scale}" style="width:${(w * scale).toFixed(1)}px;height:${(h * scale).toFixed(1)}px">`
    + `<div class="frame-in" style="width:${w}px;height:${h}px;zoom:${scale}">${inner}</div></div>`;
}

// ── 그림: PC 견적 작성 (ORD-S01) ────────────────────────────────────────
function btnHtml(s, key, label, cls = '') {
  const k = s.btn === 'bottom' && KEYS[key] ? `<kbd>(${KEYS[key]})</kbd>` : '';
  return `<span class="u-btn ${cls}">${label}${k}</span>`;
}
function tableHtml(s, items, cols, opt = {}) {
  const W = WORDS[s.words];
  const grid = s.table === 'grid';
  const all = {
    code: { h: W.code, w: 9, td: it => it.code },
    name: { h: W.name, w: 19, td: it => it.name },
    spec: { h: '규격', w: 12, td: it => it.spec },
    qty: { h: '수량', w: 6, n: 1, td: it => it.qty },
    price: { h: '단가', w: 10, n: 1, td: it => fmt(it.price) },
    supply: { h: '공급가액', w: 11, n: 1, td: it => fmt(supply(it)) },
    vat: { h: '부가세', w: 9, n: 1, td: it => fmt(vat(it)) },
    total: { h: '합계', w: 11, n: 1, td: it => fmt(supply(it) + vat(it)) },
    memo: { h: W.memo, w: 13, td: it => it.lack ? '<span class="u-pill s-late">가용 0</span>' : it.memo },
  };
  const cs = cols.map(c => all[c]);
  const sum = cs.reduce((a, c) => a + c.w, 0);
  const col = (grid ? '<col style="width:38px">' : '') + cs.map(c => `<col style="width:${(c.w / sum * 100).toFixed(2)}%">`).join('');
  const head = (grid ? '<th class="c">No</th>' : '') + cs.map(c => `<th${c.n ? ' class="n"' : ''}>${c.h}</th>`).join('');
  const rows = items.map((it, i) => `<tr data-r>${grid ? `<td class="no"><span>${i + 1}</span></td>` : ''}${cs.map(c => `<td${c.n ? ' class="n"' : ''}>${c.td(it)}</td>`).join('')}</tr>`).join('');
  // 이카운트처럼 칸막이 표는 빈 줄에도 번호를 단다. 나머지는 '줄 추가' 한 줄
  const tail = !opt.fill ? ''
    : grid ? Array.from({ length: opt.fill }, (_, i) => `<tr><td class="no"><span>${items.length + i + 1}</span></td>${cs.map(() => '<td></td>').join('')}</tr>`).join('')
    : `<tr><td class="add" colspan="${cs.length}">+ 줄 추가</td></tr>`;
  return `<table class="u-table"><colgroup>${col}</colgroup><thead><tr>${head}</tr></thead><tbody>${rows}${tail}</tbody></table>`;
}

const CROP = {
  text: { w: 330, h: 122, scale: 1 },
  density: { w: 330, h: 208, scale: 1 },
  screen: { w: 1000, h: 800, scale: 0.33 },
  table: { w: 470, h: 190, scale: 0.7 },
  controls: { w: 330, h: 168, scale: 1 },
  status: { w: 330, h: 44, scale: 1 },
};
function cropHtml(s, kind) {
  const c = CROP[kind];
  return frame(kind === 'screen' ? pcMock(s) : mini(s, kind), c.w, c.h, c.scale);
}

function axisPage(n, part, title, keys, extra = '') {
  const base = PRESETS.B.s;
  // keys 에 HTML 을 넣으면 그 자리에 그대로 끼운다
  const rows = keys.map(k => {
    if (k.startsWith('<')) return k;
    const a = axis(k);
    const opts = a.opts.map(o => {
      const tags = tagsFor(k, o.v).map(t => `<em class="tag">시안 ${t}</em>`).join('');
      return `<figure class="opt">${cropHtml(full({ ...base, [k]: o.v }), a.crop)}`
        + `<figcaption><b>${o.label}</b>${o.note ? `<span>${o.note}</span>` : ''}${tags}<span class="pick">${cb}이게 좋다</span></figcaption></figure>`;
    }).join('');
    return `<div class="axis"><div class="axis-h"><b>${a.name}</b><span>${a.q}</span><small>${a.real ? '실제 크기' : '작게 줄임'}</small></div><div class="axis-opts">${opts}</div></div>`;

}

<p class="lede">고른 시안 하나에 표시하고, 다른 시안에서 가져오고 싶은 것이 있으면 "섞고 싶은 것" 에 적어 주세요.</p></div>
<div class="tscroll"><table class="t vote"><colgroup><col style="width:10%"><col style="width:11%"><col style="width:12%"><col style="width:21%"><col style="width:13%"><col style="width:15%"><col></colgroup>
<thead><tr><th>이름</th><th>역할<small>영업 · 창고 · 경리 · 과장</small></th><th>고른 시안</th><th>섞고 싶은 것<small>예) B 인데 글자는 크게, 버튼은 아래</small></th><th>용어</th><th>안내 문구</th><th>한 마디</th></tr></thead>
<tbody>${row.repeat(9)}</tbody></table></div>
<div class="wrap-up"><b>정리 (진행자)</b><span>최종 시안</span><span>바꿀 항목</span><span>용어</span><span>안내 문구</span><span>날짜</span><span>진행</span></div>`, false);
}

function buildPages() {
  const status = `<div class="axis"><div class="axis-h"><b>상태 표시</b><span>색마다 이렇게 보입니다 — 위 '색' 에서 같이 고릅니다</span><small>실제 크기</small></div><div class="axis-opts">${axis('color').opts.map(o => `<figure class="opt">${cropHtml(full({ ...PRESETS.B.s, color: o.v }), 'status')}</figure>`).join('')}</div></div>`;
  const keys = `<div class="keys"><b>단축키</b><span>이카운트에서 쓰던 키(F2 신규 · F3 찾기 · F8 저장)를 새 프로그램에서도 똑같이 쓸까요?</span><span>${cb}똑같이</span><span>${cb}필요 없음</span><span>${cb}잘 모르겠음</span></div>`;
  document.getElementById('pages').innerHTML = [
    coverPage(),
    presetPage('A', 2), presetPage('B', 3), presetPage('C', 4),
    axisPage(5, 1, '글자와 촘촘함', ['font', 'size', 'density']),
    axisPage(6, 2, '색과 표', ['color', status, 'table']),
    axisPage(7, 3, '버튼과 모서리', ['btn', 'radius'], keys),
    termsPage(8), votePage(9),
  ].join('');
}

// 높이를 고정한 표 · 목록에서 가려진 줄을 센다 — 넉넉할수록 덜 보이는 걸 그대로 보여준다
function markMore(root) {
  root.querySelectorAll('[data-scroll]').forEach(box => {
    const more = box.querySelector('.u-more');
    if (!more) return;
    more.hidden = true;
    const bottom = box.getBoundingClientRect().bottom;
    const hidden = [...box.querySelectorAll('[data-r]')].filter(r => r.getBoundingClientRect().bottom > bottom + 0.5).length;
    if (!hidden) return;
    more.textContent = `아래로 ${hidden}${box.dataset.scroll} 더 ↓`;
    more.hidden = false;
  });
}

// ── 바꿔 보기 ───────────────────────────────────────────────────────────
const state = { ...PRESETS.A.s, ...SAY };
const $ = id => document.getElementById(id);
const seg = (k, opts) => `<div class="seg" role="group">${opts.map(o => `<button type="button" data-k="${k}" data-v="${o.v}">${o.label}</button>`).join('')}</div>`;

function buildPanel() {
  $('presetCtl').innerHTML = `<div class="grp"><span>시안</span>${seg('preset', Object.entries(PRESETS).map(([v, p]) => ({ v, label: `${v} ${p.name}` })))}</div>`;
  $('axisCtl').innerHTML = AXES.map(a => `<div class="grp"><span>${a.name}</span>${seg(a.k, a.opts)}</div>`).join('');
  $('sayCtl').innerHTML = SAY_AXES.map(a => `<div class="grp"><span>${a.name}</span>${seg(a.k, a.opts)}</div>`).join('');
}
function nearest() {
  let best = 'A', hit = -1;
  for (const [key, p] of Object.entries(PRESETS)) {
    const n = AXES.filter(a => p.s[a.k] === state[a.k]).length;
    if (n > hit) { best = key; hit = n; }
  }
  return best;
}
function paintPanel() {
  const near = nearest();
  const diff = AXES.filter(a => PRESETS[near].s[a.k] !== state[a.k]);
  document.querySelectorAll('#panel [data-k]').forEach(b => {
    const on = b.dataset.k === 'preset' ? !diff.length && b.dataset.v === near : state[b.dataset.k] === b.dataset.v;
    b.setAttribute('aria-pressed', on);
  });
  const say = SAY_AXES.map(a => optOf(a, state[a.k]).label).join(' · ');
  $('now').innerHTML = diff.length
    ? `지금: <b>시안 ${near} 바탕</b> + ${diff.map(a => `${a.name} ${optOf(a, state[a.k]).label}`).join(' · ')} — ${say}`
    : `지금: <b>시안 ${near} 그대로</b> — ${say}`;
}
// 휴대폰 그림을 먼저 그려야 PC 그림 칸 폭이 맞게 잡힌다 (넓은 화면은 두 칸, 좁은 화면은 위아래)
function renderLive() {
  const live = document.querySelector('.live');
  $('livePh').innerHTML = frame(phoneMock(state), 360, 640, Math.min(0.9, live.clientWidth / 360));
  const box = $('livePc');
  const scale = Math.min(1, box.clientWidth / 1000) || 1;
  box.innerHTML = frame(pcMock(state), 1000, 800, scale);
  markMore(live);
}
$('panel').addEventListener('click', e => {
  const b = e.target.closest('button[data-k]');
  if (!b) return;
  if (b.dataset.k === 'preset') Object.assign(state, PRESETS[b.dataset.v].s);
  else state[b.dataset.k] = b.dataset.v;
  paintPanel();
  renderLive();
});
$('print').addEventListener('click', () => window.print());

// 화면 폭에 맞추기 (인쇄는 늘 100%) — 넓으면 종이째 줄이고, 좁으면(CSS 의 900px 과 같은 값) 종이 안을 다시 늘어놓고 그림만 줄인다
const NARROW = matchMedia('screen and (max-width: 900px)');
function refitSheets(narrow) {
  document.querySelectorAll('.sheet').forEach(sh => {
    const cs = getComputedStyle(sh);
    const avail = sh.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 2;
    sh.querySelectorAll('.frame[data-fw]').forEach(fr => {
      const w = +fr.dataset.fw, h = +fr.dataset.fh, s0 = +fr.dataset.fs;
      const s = narrow ? Math.min(s0, avail / w) : s0;
      fr.style.width = `${(w * s).toFixed(1)}px`;
      fr.style.height = `${(h * s).toFixed(1)}px`;
      fr.firstElementChild.style.zoom = s;
    });
  });
}
function fitPages() {
  const narrow = NARROW.matches;
  $('pages').style.zoom = narrow ? '1' : Math.min(1, (document.documentElement.clientWidth - 32) / 1123).toFixed(3);
  refitSheets(narrow);
}

buildPanel();
buildPages();
paintPanel();
fitPages();
renderLive();
markMore($('pages'));
let resizing = 0;
addEventListener('resize', () => { cancelAnimationFrame(resizing); resizing = requestAnimationFrame(() => { fitPages(); renderLive(); markMore($('pages')); }); });
// 글꼴이 늦게 오면 줄 높이가 바뀐다 — 다 온 뒤 다시 센다
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { fitPages(); renderLive(); markMore($('pages')); });
// 인쇄 — 좁은 화면에서 줄였던 종이 그림을 원래 크기로 돌려 찍고, 끝나면 다시 맞춘다
addEventListener('beforeprint', () => { refitSheets(false); markMore($('pages')); });
addEventListener('afterprint', () => { fitPages(); markMore($('pages')); });
</script>
</body>
