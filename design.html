<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>화면 모양 고르기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@800&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<!-- Pretendard 는 고정 굵기(static) 판으로 — 가변 글꼴은 PDF 에 그림 글꼴(Type 3)로 들어가 글자가 글자로 남지 않는다 (10-20 확인) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<style>
/* 화면 모양 고르기 (10-20) — 10-02 화면 느낌 고르기(시안 A B C)를 이었다.
   기준 화면 하나(견적 작성 ORD-S01, "정돈된 업무용")에서 한 번에 한 가지만 바꿔 본다.
   화면에서 열면 바꿔 보기 · 바뀐 곳 노란 표시 · 합쳐 보기, 인쇄하면 A4 가로 12장.
   문서 바탕은 중립 회색 — 어느 보기도 편들지 않는다. 종이는 늘 흰색. */
:root{
  --desk:#E4E7EB;--chrome:#FFFFFF;--chrome-ink:#1B2430;--chrome-sub:#5F6B7A;--chrome-rule:#D5DBE3;--chrome-on:#1B2430;--chrome-on-ink:#FFFFFF;--chrome-soft:#F1F3F6;
  --ink:#1B2430;--sub:#5F6B7A;--mute:#9AA4B1;--rule:#CDD3DB;--faint:#F3F5F7;
  --mk:#E2AE00;--mk-bg:rgba(255,206,0,.16);
}
@media screen and (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark;--desk:#14181D;--chrome:#1C2128;--chrome-ink:#E6EAF0;--chrome-sub:#9AA5B3;--chrome-rule:#2E3640;--chrome-on:#E6EAF0;--chrome-on-ink:#14181D;--chrome-soft:#242A32}
}
:root[data-theme="dark"]{color-scheme:dark;--desk:#14181D;--chrome:#1C2128;--chrome-ink:#E6EAF0;--chrome-sub:#9AA5B3;--chrome-rule:#2E3640;--chrome-on:#E6EAF0;--chrome-on-ink:#14181D;--chrome-soft:#242A32}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--desk);color:var(--chrome-ink);font-family:'IBM Plex Sans KR','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;font-size:14px;line-height:1.5;word-break:keep-all}
button{font:inherit;color:inherit}

/* ── 바꿔 보기 (화면 전용) ───────────────────────────────────────────── */
.bar{background:var(--chrome);border-bottom:1px solid var(--chrome-rule);padding:12px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px}
.bar h1{margin:0;font-family:'Gothic A1','IBM Plex Sans KR',sans-serif;font-weight:800;font-size:20px;white-space:nowrap}
.bar .hint{margin:0;flex:1 1 360px;color:var(--chrome-sub);font-size:13px}
.btn-c{border:1px solid var(--chrome-rule);background:var(--chrome);color:var(--chrome-ink);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap;transition:background-color .15s ease,border-color .15s ease}
.btn-c:hover{background:var(--chrome-soft)}
.btn-c.on{background:var(--chrome-on);border-color:var(--chrome-on);color:var(--chrome-on-ink);font-weight:600}
.btn-c:focus-visible,.seg button:focus-visible,.sw input:focus-visible{outline:2px solid #5FA8FF;outline-offset:1px}

.tool{display:grid;grid-template-columns:288px minmax(0,1fr);gap:16px;padding:16px;align-items:start}
.ctl{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;background:var(--chrome);border:1px solid var(--chrome-rule);border-radius:10px;padding:12px;display:grid;gap:12px}
.modes{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--chrome-rule);border-radius:8px;overflow:hidden}
.modes button{border:0;border-left:1px solid var(--chrome-rule);background:transparent;padding:8px 6px;font-size:13px;cursor:pointer;transition:background-color .15s ease,color .15s ease}
.modes button:first-child{border-left:0}
.modes button[aria-pressed="true"]{background:var(--chrome-on);color:var(--chrome-on-ink);font-weight:600}
.sws{display:grid;gap:4px}
.sw{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--chrome-ink);cursor:pointer}
.sw input{margin:0;width:16px;height:16px;accent-color:var(--chrome-on)}
.sw[hidden]{display:none}
.items{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.it{padding:7px 8px 8px;border-radius:8px;border:1px solid transparent;display:grid;gap:5px;transition:background-color .15s ease,border-color .15s ease}
.it.cur{background:var(--chrome-soft);border-color:var(--chrome-rule)}
.it-h{display:flex;align-items:baseline;gap:6px}
.it-n{flex:none;width:18px;font-size:12px;color:var(--chrome-sub)}
.it-h b{font-size:13.5px;font-weight:600}
.it-h small{margin-left:auto;font-size:11.5px;color:var(--chrome-sub);white-space:nowrap}
.it.chg .it-h b::after{content:"바뀜";margin-left:6px;padding:0 5px;border-radius:4px;background:var(--mk-bg);border:1px solid var(--mk);font-size:11px;font-weight:600;color:var(--chrome-ink)}
.seg{display:grid;border:1px solid var(--chrome-rule);border-radius:8px;overflow:hidden}
.seg button{position:relative;border:0;border-left:1px solid var(--chrome-rule);background:transparent;padding:5px 4px;font-size:13px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background-color .15s ease,color .15s ease}
.seg button:first-child{border-left:0}
.seg button:hover{background:var(--chrome-soft)}
.seg button[aria-pressed="true"]{background:var(--chrome-on);color:var(--chrome-on-ink);font-weight:600}
.seg button.picked::after{content:"";position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--mk)}
.ctl .legend{margin:0;font-size:12px;color:var(--chrome-sub);line-height:1.45}
.ctl .legend i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--mk);margin-right:4px;vertical-align:1px}

.stage-wrap{min-width:0;display:grid;gap:10px}
.said{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--chrome);border:1px solid var(--chrome-rule);border-radius:10px;padding:9px 12px;min-height:46px}
.said p{margin:0;flex:1 1 320px;font-size:14px}
.said p .s{color:var(--chrome-sub)}
.said .acts{display:flex;gap:6px;flex-wrap:wrap}
.stage{min-width:0;overflow:auto;position:relative}
.stage .frame{border:1px solid var(--chrome-rule)}
.stage-note{margin:0;font-size:13px;color:var(--chrome-sub)}
.stage.phone .frame{width:auto!important;height:auto!important;overflow:visible}
.stage.phone .frame-in{position:static;width:auto!important;height:auto!important;zoom:1!important}
.desk-h{margin:8px 16px 0;font-size:15px;color:var(--chrome-sub);font-weight:600}
.pages-wrap{padding:12px 16px 32px;overflow:hidden}
#measure{position:absolute;left:-20000px;top:0;visibility:hidden;pointer-events:none}
@media (max-width:1100px){
  .tool{grid-template-columns:minmax(0,1fr)}
  .ctl{position:static;max-height:none}
  .items{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* ── 그림 틀 — 실제 크기로 그리고 zoom 으로 줄인다.
   transform: scale 은 인쇄 때 줄이기 전 크기로 종이 끝에서 잘린다 (크롬, 10-01 확인) ── */
.frame{position:relative;overflow:hidden;flex:none}
.frame-in{position:absolute;top:0;left:0}
/* 종이 위 그림은 틀 밖으로 아무것도 새지 않게 가둔다 — 안 가두면 인쇄 때 그림 속 위치 잡은 칸들이 종이 폭을 넓혀
   크롬이 종이 전체를 71% 로 줄여 찍는다 (10-20 확인) */
.sheet .frame{contain:strict}
.sheet .u-tbl{overflow:hidden} /* 종이에는 스크롤 막대를 찍지 않는다 */
.crop-in{position:absolute}
.win{position:absolute;border:9px solid #1B2430;outline:6px solid #FFFFFF;pointer-events:none;z-index:30}

/* ── 그림: 견적 작성 (ORD-S01) — 항목 값은 data-* → 변수.
   기준 = "정돈된 업무용": 연회색 바탕 · 흰 판 · 파랑 하나 · 글자 14 · 가는 선 · 칸막이 + 줄 번호 표 ── */
.ui{--fs:14px;--row:33px;--ctl:30px;--gap:12px;--fpad:14px;--sidew:216px;--toph:calc(var(--ctl) + 18px);
  --r-in:3px;--r-btn:4px;--r-pn:4px;--r-pill:3px;
  --bg:#EEF0F3;--pn:#FFFFFF;--in:#FFFFFF;--ln:#D8DCE2;--ln2:#ECEEF1;--lnh:#B9C0CA;--hd:#F6F7F9;--ink:#1D232B;--sub:#59626E;--hov:#F2F5FB;--zeb:#EDF0F4;--warn:#9B4C00;--ok:#1D7445;--chip:#F1F3F6;--red:#C0262D;
  --acc:#2A5BB5;--acc-soft:#E8EEF9;--acc-hi:#86A9EC;--pri:#2A5BB5;--pri-h:#234E9C;--pri-ink:#FFFFFF;
  --nav:var(--pn);--nav-ink:var(--ink);--nav-sub:var(--sub);--nav-ln:var(--ln);--nav-on:var(--acc-soft);--nav-on-ink:var(--ink);--nav-bar:var(--acc);--nav-hov:var(--hov);--nav-box:var(--ln);
  position:relative;display:flex;overflow:hidden;width:1440px;height:900px;color-scheme:light;
  font-family:Pretendard,"Pretendard Variable","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  font-size:var(--fs);line-height:1.4;color:var(--ink);background:var(--bg);font-variant-numeric:tabular-nums;letter-spacing:-0.01em;word-break:keep-all;text-align:left}
.ui *{box-sizing:border-box}
/* 강조색 */
.ui[data-acc="teal"]{--acc:#0E8A78;--acc-soft:#E1F3EF;--acc-hi:#45C2AC;--pri:#0E7C6B;--pri-h:#0B6B5C}
/* 화면 밝기 — 다크는 뒤집은 색이 아니라 따로 맞춘 색 */
.ui[data-lum="dark"]{color-scheme:dark;--bg:#13161B;--pn:#1A1E24;--in:#16191E;--ln:#2D333C;--ln2:#242930;--lnh:#46505C;--hd:#1F242B;--ink:#E3E6EA;--sub:#9CA4AF;--hov:#212833;--zeb:#20252C;--warn:#E3A05C;--ok:#6CC08C;--chip:#242A32;--red:#D93A41;
  --acc:#86A9EC;--acc-soft:#203050;--pri:#3F67BA;--pri-h:#4A73C6}
.ui[data-lum="dark"][data-acc="teal"]{--acc:#4CC3AE;--acc-soft:#16382F;--acc-hi:#4CC3AE;--pri:#12806E;--pri-h:#17917D}
/* 왼쪽 메뉴 색 */
.ui[data-nav="navy"]{--nav:#1E3A5F;--nav-ink:#EEF3F9;--nav-sub:#A9BACD;--nav-ln:#1E3A5F;--nav-on:#2B4C77;--nav-on-ink:#FFFFFF;--nav-bar:var(--acc-hi);--nav-hov:#25466F;--nav-box:#3B5B83}
.ui[data-nav="navy"][data-lum="dark"]{--nav:#172A42;--nav-ink:#DCE5F0;--nav-sub:#91A4BB;--nav-ln:#172A42;--nav-on:#223A5C;--nav-hov:#1D3352;--nav-box:#2F4868}
/* 글자 크기 · 촘촘함 · 모서리 */
.ui[data-fs="15"]{--fs:15px}
.ui[data-fs="16"]{--fs:16px}
.ui[data-den="normal"]{--row:40px;--ctl:34px;--gap:14px;--fpad:16px}
.ui[data-den="loose"]{--row:48px;--ctl:40px;--gap:18px;--fpad:20px}
.ui[data-rad="soft"]{--r-in:7px;--r-btn:8px;--r-pn:10px;--r-pill:6px}
.ui[data-rad="round"]{--r-in:12px;--r-btn:12px;--r-pn:16px;--r-pill:999px}
.ui[data-side="icon"]{--sidew:64px}

/* 바뀐 곳 표시 — 노란 테두리 · 노란 바탕 (그림 위에 덮는다) */
.ui [data-z]{position:relative}
.ui[data-z]::after,.ui [data-z]::after{content:"";position:absolute;inset:0;border:2.5px solid var(--mk);background:var(--mk-bg);border-radius:inherit;opacity:0;pointer-events:none;z-index:7;transition:opacity .18s ease}
.ui [data-z].mk::after{opacity:1}
/* 색을 고르는 항목은 노란 바탕을 깔지 않고 테두리만 — 바탕을 깔면 고르려는 색이 바뀌어 보인다 */
.ui [data-z].mk.line::after{background:transparent;border-width:3px}

/* 왼쪽 메뉴 */
.u-side{flex:none;width:var(--sidew);display:flex;flex-direction:column;background:var(--nav);color:var(--nav-ink);border-right:1px solid var(--nav-ln);overflow:hidden;z-index:3}
.u-brand{flex:none;display:flex;align-items:center;gap:10px;height:var(--toph);padding:0 16px;border-bottom:1px solid var(--nav-ln);font-weight:700;font-size:1.07em;white-space:nowrap}
.u-mark{flex:none;display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border:1.5px solid currentColor;border-radius:var(--r-in);font-size:13px;font-weight:800}
.u-co{flex:none;padding:12px 12px 12px;border-bottom:1px solid var(--nav-ln)}
.u-co-l{display:block;margin:0 0 6px 4px;font-size:.86em;color:var(--nav-sub);white-space:nowrap}
.u-co-b{display:flex;align-items:center;gap:8px;height:calc(var(--ctl) + 4px);padding:0 8px;border:1px solid var(--nav-box);border-radius:var(--r-in);white-space:nowrap;overflow:hidden;cursor:pointer}
.u-co-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.u-caret{flex:none;width:14px;height:14px;color:var(--nav-sub)}
.u-logo{flex:none;display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:22px;padding:0 4px;border:1px solid currentColor;border-radius:3px;font-size:11.5px;font-weight:800;letter-spacing:.02em;line-height:1}
.u-menu{flex:1;display:flex;flex-direction:column;gap:2px;padding:10px 8px}
.u-mi{position:relative;display:flex;align-items:center;gap:10px;height:calc(var(--ctl) + 6px);padding:0 10px;border-radius:var(--r-btn);color:var(--nav-ink);white-space:nowrap;cursor:pointer}
.u-mi svg{flex:none;width:1.25em;height:1.25em;color:var(--nav-sub)}
.u-mi:hover{background:var(--nav-hov)}
.u-mi.on{background:var(--nav-on);color:var(--nav-on-ink);font-weight:600}
.u-mi.on svg{color:var(--nav-bar)}
.u-mi.on::before{content:"";position:absolute;left:-8px;top:7px;bottom:7px;width:3px;border-radius:0 2px 2px 0;background:var(--nav-bar)}
.u-cnt{margin-left:auto;display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:19px;padding:0 6px;border:1px solid var(--nav-box);border-radius:var(--r-pill);font-size:.82em;color:var(--nav-sub)}
.u-msp{flex:1}
.ui[data-side="icon"] .u-side .u-lbl,.ui[data-side="icon"] .u-side .u-cnt{display:none}
.ui[data-side="icon"] .u-brand{justify-content:center;padding:0}
.ui[data-side="icon"] .u-co{padding:12px 8px}
.ui[data-side="icon"] .u-co-b{justify-content:center;padding:0;border-color:transparent}
.ui[data-side="icon"] .u-mi{justify-content:center;padding:0}

/* 머리줄 · 본문 */
.u-main{flex:1;min-width:0;display:flex;flex-direction:column}
.u-top{flex:none;display:flex;align-items:center;gap:12px;height:var(--toph);padding:0 20px 0 10px;background:var(--pn);border-bottom:1px solid var(--ln)}
.u-burger{flex:none;display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:var(--r-btn);color:var(--sub);cursor:pointer}
.u-burger svg{width:18px;height:18px}
.u-burger:hover{background:var(--hov)}
.u-crumb{font-size:.93em;color:var(--sub);white-space:nowrap}
.u-crumb b{color:var(--ink);font-weight:600}
.u-sp{flex:1}
.u-find{display:flex;align-items:center;gap:8px;width:280px;height:var(--ctl);padding:0 10px;border:1px solid var(--ln);border-radius:var(--r-in);background:var(--in);color:var(--sub);font-size:.93em;white-space:nowrap;overflow:hidden}
.u-find svg{flex:none;width:14px;height:14px}
.u-user{font-size:.93em;color:var(--sub);white-space:nowrap}
.u-page{flex:1;min-height:0;display:flex;flex-direction:column;gap:var(--gap);padding:14px 20px 0}
.u-titlerow{flex:none;display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;min-height:calc(var(--ctl) + 2px)}
.u-h1{font-size:1.29em;font-weight:600;white-space:nowrap}
.u-chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border:1px solid var(--ln);border-radius:var(--r-pill);background:var(--chip);font-size:.86em;color:var(--sub);white-space:nowrap}
.u-qno{font-size:.93em;color:var(--sub);white-space:nowrap}
.u-saved{font-size:.93em;color:var(--ok);white-space:nowrap}
.u-acts-top{display:none;margin-left:auto;align-items:center;gap:8px}
.u-panel{background:var(--pn);border:1px solid var(--ln);border-radius:var(--r-pn)}
.u-form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:calc(var(--gap) - 2px) 28px;padding:var(--fpad) 16px}
.u-f{position:relative;display:flex;align-items:center;gap:10px;min-width:0}
.u-l{flex:none;width:4.6em;text-align:right;font-size:.93em;color:var(--sub);white-space:nowrap}
.u-in{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:var(--ctl);padding:0 9px;border:1px solid var(--ln);border-radius:var(--r-in);background:var(--in);white-space:nowrap;overflow:hidden;cursor:text}
.u-in svg{flex:none;margin-left:auto;width:14px;height:14px;color:var(--sub)}
.u-in:hover{border-color:var(--lnh)}
.u-in .u-logo{height:20px;min-width:30px;font-size:11px}
.u-info{display:flex;flex-wrap:wrap;align-items:center;gap:4px 18px;padding:9px 16px;border-top:1px solid var(--ln2);font-size:.93em}
.u-s{color:var(--sub)}
.u-warn{color:var(--warn);font-weight:600}
.u-tp{flex:1;min-height:0;display:flex;flex-direction:column}
.u-tph{flex:none;display:flex;align-items:center;gap:8px;height:calc(var(--ctl) + 10px);padding:0 16px;border-bottom:1px solid var(--ln)}
.u-tph b{font-weight:600}
.u-tph .u-s{font-size:.93em}
.u-tbl{flex:1;min-height:0;overflow:auto}
.u-tr{display:grid}
.u-cols{grid-template-columns:3.2em 6em minmax(13em,1fr) 8em 3.8em 8.6em 7.6em 6.6em 7.6em 7.6em}
.ui:not([data-tbl="grid"]) .u-cols{grid-template-columns:6em minmax(13em,1fr) 8em 3.8em 8.6em 7.6em 6.6em 7.6em 7.6em}
.ui:not([data-tbl="grid"]) .u-no{display:none}
.u-th{position:sticky;top:0;z-index:2}
.u-th > div{height:calc(var(--row) + 1px);line-height:var(--row);padding:0 10px;background:var(--hd);color:var(--sub);font-size:.93em;font-weight:600;white-space:nowrap;overflow:hidden}
.u-td{position:relative;height:var(--row);line-height:calc(var(--row) - 1px);padding:0 10px;background:var(--pn);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;cursor:cell}
.u-td.u-name{display:flex;align-items:center;gap:8px}
.u-tx{min-width:0;overflow:hidden;text-overflow:ellipsis}
.u-code,.u-spec{color:var(--sub)}
.u-ph{color:var(--sub)}
.n{text-align:right}
.u-th > .n{text-align:right}
.u-no{text-align:center;padding:0!important;color:var(--sub)}
.u-tag{flex:none;display:inline-flex;align-items:center;height:19px;padding:0 6px;border:1px solid var(--ln);border-radius:var(--r-pill);font-size:.82em;line-height:1;color:var(--sub)}
.u-fix{position:absolute;left:6px;top:50%;margin-top:-9px;height:18px;line-height:16px;padding:0 5px;border:1px solid var(--warn);border-radius:var(--r-pill);background:var(--pn);font-size:.82em;font-weight:600;color:var(--warn)}
/* 표 모양 — 칸막이 + 줄 번호 (기준) · 가로줄 · 줄무늬 */
.ui[data-tbl="grid"] .u-th > div{border-bottom:1px solid var(--ln);border-right:1px solid var(--ln2)}
.ui[data-tbl="grid"] .u-td{border-bottom:1px solid var(--ln2);border-right:1px solid var(--ln2)}
.ui[data-tbl="lines"] .u-th > div{background:transparent;border-bottom:1.5px solid var(--lnh)}
.ui[data-tbl="lines"] .u-td{border-bottom:1px solid var(--ln)}
.ui[data-tbl="zebra"] .u-th > div{border-bottom:1px solid var(--ln)}
.ui[data-tbl="zebra"] .u-tb > .u-tr:nth-child(even) > .u-td{background:var(--zeb)}
.u-tb > .u-tr:hover > .u-td{background:var(--hov)}
.u-tb > .u-tr.on > .u-td{background:var(--acc-soft)}
.u-td.sel{outline:2px solid var(--acc);outline-offset:-2px}
.u-sum{flex:none;display:flex;justify-content:flex-end;align-items:baseline;flex-wrap:wrap;gap:6px 28px;padding:10px 16px;border-top:1px solid var(--ln);font-size:.93em;color:var(--sub)}
.u-sum b{margin-left:6px;font-size:1.07em;font-weight:600;color:var(--ink)}
.u-sum .g b{font-size:1.3em;font-weight:700}

/* 버튼 — 아래 보통 (기준) · 아래 큰 버튼 · 오른쪽 위 */
.u-foot{flex:none;display:flex;align-items:center;gap:8px;min-height:calc(var(--ctl) + 26px);margin-top:var(--gap);padding:0 20px;background:var(--pn);border-top:1px solid var(--ln)}
.u-msg{flex:1;min-width:0;margin:0 10px;font-size:.93em;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u-bw{position:relative;display:inline-flex;flex:none}
.u-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;height:calc(var(--ctl) + 2px);padding:0 14px;border:1px solid var(--ln);border-radius:var(--r-btn);background:var(--pn);color:var(--ink);white-space:nowrap;cursor:pointer;flex:none}
.u-btn:hover{background:var(--hov);border-color:var(--lnh)}
.u-btn.ghost{border-color:transparent;background:transparent;color:var(--sub)}
.u-btn.ghost:hover{background:var(--hov);color:var(--ink)}
.u-btn.pri{border-color:var(--pri);background:var(--pri);color:var(--pri-ink);font-weight:600}
.u-btn.pri:hover{border-color:var(--pri-h);background:var(--pri-h)}
.ui[data-btn="big"] .u-foot{min-height:76px}
.ui[data-btn="big"] .u-foot .u-btn.main{height:52px;padding:0 22px;font-size:1.07em;font-weight:600;min-width:6.5em}
.ui[data-btn="big"] .u-foot .u-btn.pri{min-width:10em;font-weight:700}
.ui[data-btn="top"] .u-foot{display:none}
.ui[data-btn="top"] .u-acts-top{display:flex}
.ui[data-btn="top"] .u-page{padding-bottom:20px}

/* 빨간 번호 = 기능 ID (화면법 가-3) */
.u-fid{position:absolute;z-index:8;top:-13px;left:-8px;height:18px;line-height:18px;padding:0 6px;border-radius:999px;background:var(--red);color:#FFFFFF;font-size:12px;font-weight:700;letter-spacing:0;white-space:nowrap;pointer-events:none}
.ui[data-badges="off"] .u-fid{display:none}
.u-scrim{display:none}

/* 바꿔 볼 때 · 줄에 올릴 때 · 칸을 고를 때 — 짧게 (0.12~0.2초), 길게 미끄러지지 않는다 */
.stage .ui,.stage .ui *{transition-property:background-color,border-color,color,border-radius,outline-color;transition-duration:.16s;transition-timing-function:ease}
.stage .u-side{transition-property:width,background-color,border-color,color,transform;transition-duration:.18s}
.stage .u-tb > .u-tr > .u-td{transition-duration:.12s}

/* 휴대폰 폭 — 왼쪽 메뉴는 접고 ☰ 로 연다, 머리 칸은 한 줄씩, 표는 옆으로 민다 */
.ui[data-dev="phone"]{width:100%;height:auto;min-height:620px}
.ui[data-dev="phone"] .u-side{position:absolute;left:0;top:0;bottom:0;z-index:20;width:248px;transform:translateX(-101%)}
.ui[data-dev="phone"][data-side="icon"] .u-side{width:64px}
.ui[data-dev="phone"][data-drawer="open"] .u-side{transform:none}
.ui[data-dev="phone"][data-drawer="open"] .u-scrim{display:block;position:absolute;inset:0;z-index:19;background:rgba(10,14,20,.38)}
.ui[data-dev="phone"] .u-top{padding:0 12px 0 6px}
.ui[data-dev="phone"] .u-find,.ui[data-dev="phone"] .u-user{display:none}
.ui[data-dev="phone"] .u-page{padding:12px 12px 0}
.ui[data-dev="phone"] .u-form{grid-template-columns:minmax(0,1fr);padding:var(--fpad) 12px}
.ui[data-dev="phone"] .u-l{width:4.8em}
.ui[data-dev="phone"] .u-tp{flex:none}
.ui[data-dev="phone"] .u-tbl{max-height:calc(var(--row) * 9 + 2px)}
.ui[data-dev="phone"] .u-tph .u-sp,.ui[data-dev="phone"] .u-tph .u-s + .u-sp + .u-s{display:none}
.ui[data-dev="phone"] .u-tr{min-width:62em}
.ui[data-dev="phone"] .u-sum{justify-content:flex-start;gap:4px 18px}
.ui[data-dev="phone"] .u-foot{flex-wrap:wrap;padding:10px 12px;gap:8px}
.ui[data-dev="phone"] .u-msg{order:-1;flex-basis:100%;margin:0;white-space:normal}
.ui[data-dev="phone"][data-btn="big"] .u-foot .u-btn.main{min-width:0;padding:0 16px}
.ui[data-dev="phone"][data-btn="big"] .u-foot .u-bw{flex:1 1 auto}
.ui[data-dev="phone"][data-btn="big"] .u-foot .u-bw .u-btn{width:100%}
.ui[data-dev="phone"] .u-acts-top{margin-left:0;flex-wrap:wrap;width:100%}

/* ── 종이 ─────────────────────────────────────────────────────────────── */
#pages{display:grid;gap:10mm;justify-items:center}
.sheet{width:297mm;height:210mm;padding:9mm;background:#FFFFFF;color:var(--ink);position:relative;overflow:hidden;display:flex;flex-direction:column;gap:3mm;
  font-size:10pt;line-height:1.45;word-break:keep-all;box-shadow:0 1px 3px rgba(0,0,0,.12),0 10px 28px rgba(0,0,0,.10)}
.sheet h2{margin:0;font-family:'Gothic A1','IBM Plex Sans KR',sans-serif;font-weight:800;font-size:16pt;line-height:1.2;letter-spacing:-.01em}
.sheet .lede{margin:0;color:var(--sub);font-size:9.5pt}
.pgno,.ex{position:absolute;bottom:4mm;font-size:8pt;color:var(--mute)}
.pgno{right:9mm}.ex{left:9mm}
.cb{display:inline-block;width:3.4mm;height:3.4mm;border:1.2px solid var(--ink);border-radius:.6mm;vertical-align:-.6mm;margin-right:1.2mm;background:#FFFFFF;flex:none}
.cb.ro{border-radius:50%}
.mk-sw{display:inline-block;width:7mm;height:4mm;border:1.5px solid var(--mk);background:var(--mk-bg);vertical-align:-.8mm;margin-right:1.5mm}
.tag{font-style:normal;font-size:7.5pt;color:var(--sub);border:1px solid var(--rule);border-radius:1mm;padding:0 1.2mm;white-space:nowrap}

/* 1쪽 */
.cover{gap:5mm}
.eyebrow{margin:0;font-size:9pt;color:var(--sub);letter-spacing:.04em}
.cover h1{margin:1mm 0 0;font-family:'Gothic A1','IBM Plex Sans KR',sans-serif;font-weight:800;font-size:28pt;line-height:1.1}
.cover .lede{font-size:11pt;max-width:205mm}
.c-mid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8mm;align-items:start}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:2.6mm}
.steps li{display:grid;grid-template-columns:30mm minmax(0,1fr);gap:3mm;border-top:1.5px solid var(--ink);padding-top:1.6mm;font-size:9.5pt;color:var(--sub)}
.steps b{color:var(--ink);font-size:10.5pt}
.c-fig{margin:0;display:grid;gap:1.5mm;justify-items:start}
.c-fig .frame{border:1px solid var(--rule)}
.c-fig figcaption{font-size:9pt;color:var(--sub);max-width:80mm}
.idx{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.6mm 5mm}
.idx li{display:flex;align-items:baseline;gap:2mm;background:var(--faint);border-radius:1.5mm;padding:1.6mm 2.4mm;font-size:9.5pt;min-width:0}
.idx b{white-space:nowrap}
.idx span{color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idx em{font-style:normal;color:var(--sub);font-size:8.5pt;white-space:nowrap}
.cover .notes{margin:0;padding:0;list-style:none;display:grid;gap:1mm;font-size:9pt;color:var(--sub)}
.cover .notes b{color:var(--ink)}

/* 2쪽 */
.b-head{display:grid;grid-template-columns:minmax(0,1fr) 92mm;gap:6mm;align-items:start}
.b-head .lede{margin-top:1mm}
.ord{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:.6mm 3mm;font-size:8.5pt}
.ord li{white-space:nowrap}
.ord b{display:inline-block;margin-right:1.2mm;padding:0 1.4mm;border-radius:2mm;background:#C0262D;color:#FFFFFF;font-size:7.5pt}
.b-fig{margin:0;align-self:center}
.b-fig .frame{border:1px solid var(--rule)}

/* 3~11쪽 — 항목마다 */
.i-head{display:flex;align-items:center;gap:4mm}
.i-no{flex:none;display:grid;place-items:center;width:11mm;height:11mm;border:1.5px solid var(--ink);border-radius:2mm;font-family:'Gothic A1',sans-serif;font-weight:800;font-size:20pt;line-height:1}
.i-head .lede{margin-top:.6mm}
.i-cols{flex:1;min-height:0;display:grid;gap:6mm}
.i-cols.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.i-cols.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.o-col{min-width:0;display:flex;flex-direction:column;gap:2mm}
.o-cap{display:flex;align-items:baseline;flex-wrap:wrap;gap:.5mm 2mm;min-height:6mm}
.o-cap b{font-size:11.5pt}
.o-note{font-size:8.5pt;color:var(--sub)}
.o-cap .o-pick{margin-left:auto}
.o-crop{display:flex;flex-direction:column;gap:1mm;align-items:flex-start}
.o-crop .frame{border:1px solid var(--rule)}
.o-where{font-size:7.5pt;color:var(--mute);line-height:1.2}
.o-where + .frame{margin-bottom:1mm}
.o-bot{margin-top:auto;display:flex;align-items:flex-end;gap:3mm}
.o-thumb{margin:0;display:grid;gap:.8mm}
.o-thumb .frame{border:1px solid var(--rule)}
.o-thumb figcaption{font-size:7.5pt;color:var(--mute)}
.o-side{display:grid;gap:1.6mm;align-content:end;font-size:9.5pt}
.o-stat{font-size:9pt;color:var(--ink)}
.o-stat:empty{display:none}
.o-pick{white-space:nowrap;font-size:9.5pt}
.i-rows{flex:1;min-height:0;display:grid;grid-template-rows:repeat(3,minmax(0,1fr));gap:3mm}
.o-row{min-height:0;display:grid;grid-template-columns:40mm auto minmax(0,1fr);gap:5mm;align-items:start;border-top:1px solid var(--rule);padding-top:2mm}
.o-row .o-side{align-content:start}
.o-row .o-cap{flex-direction:column;align-items:flex-start}
.o-row .o-thumb{justify-self:end}
.o-full{margin:0}
.o-full .frame{border:1px solid var(--rule)}

/* 12쪽 */
.a-head{display:grid;gap:1mm}
.t{width:100%;border-collapse:collapse;font-size:9pt;table-layout:fixed}
.t th,.t td{border:1px solid var(--rule);padding:1.4mm 1.8mm;text-align:left;vertical-align:top}
.t th{background:var(--faint);font-weight:600;font-size:8.5pt;line-height:1.3}
.t th small{display:block;font-weight:400;color:var(--sub);font-size:7.5pt}
.vote td{height:13.4mm}
.vote .vo{font-size:8pt;line-height:1.35;color:var(--ink)}
.vote .vo span{display:block;white-space:nowrap}
.vote .vo .cb{width:2.8mm;height:2.8mm;margin-right:1mm;vertical-align:-.5mm}
.wrap-up{border:1.5px solid var(--ink);border-radius:1.5mm;padding:2.5mm 4mm;display:grid;grid-template-columns:repeat(4,1fr);gap:2.5mm 6mm;font-size:9.5pt}
.wrap-up b{grid-column:1 / -1;font-size:10.5pt}
.wrap-up span{border-bottom:1px solid var(--rule);padding-bottom:1mm;color:var(--sub)}

@page{size:A4 landscape;margin:0}
@media print{
  html,body{background:#FFFFFF}
  .bar,.tool,.desk-h,#measure{display:none!important}
  .pages-wrap{padding:0;overflow:visible}
  #pages{display:block;zoom:1!important}
  .sheet{box-shadow:none;margin:0;break-after:page}
  .sheet:last-child{break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

function cropFrame(inner, r, scale) {
  return `<div class="frame" style="width:${(r.w * scale).toFixed(1)}px;height:${(r.h * scale).toFixed(1)}px"><div class="frame-in" style="width:${r.w}px;height:${r.h}px;overflow:hidden;zoom:${scale}"><div class="crop-in" style="left:${-r.x}px;top:${-r.y}px;width:1440px;height:900px">${inner}</div></div></div>`;

<ol class="steps">
  <li><b>2쪽 · 기준 화면</b><span>모든 그림은 이 화면에서 시작합니다. 먼저 한 번 훑어봐 주세요. 빨간 번호(ORD-01~05)는 기능 번호입니다.</span></li>
  <li><b>3~11쪽 · 항목 9개</b><span>한 쪽에 한 항목만 바꿨습니다. 맨 왼쪽(또는 맨 위)이 기준이고, <i class="mk-sw"></i>노란 칸이 기준에서 바뀐 자리입니다. 작은 그림은 전체 화면이고, 검은 테두리가 큰 그림의 자리입니다.</span></li>
  <li><b>12쪽 · 고르기 표</b><span>한 분씩 항목마다 마음에 드는 보기 하나에 표시해 주세요. 기준이 좋으면 기준에.</span></li>
  <li><b>마지막 · 합쳐 보기</b><span>고른 것을 모두 합치면 어색할 수 있습니다. 회의 때 화면에서 '고른 것 합쳐 보기' 로 같이 확인합니다.</span></li>
</ol>
<figure class="c-fig">${ex}<figcaption>예) 3쪽 왼쪽 메뉴 색을 남색으로 바꾼 그림 — 노란 칸이 바뀐 자리입니다.</figcaption></figure>
</div>
<ol class="idx">${idx}</ol>
<ul class="notes">
  <li><b>컬러로 인쇄해 주세요.</b> 색을 고르는 쪽이 있고, 노란 표시도 색으로 보입니다 (A4 가로 · 배율 100% · 배경 그래픽 켜기).</li>
  <li>항목 쪽의 큰 그림은 실제 화면의 75% 크기입니다. 글자 크기 · 촘촘함은 화면에서 실제 크기로 보면 더 정확합니다.</li>
  <li>의견은 쪽 번호와 빨간 번호로 주세요 — 예) 8쪽 ORD-03 표 선이 흐립니다.</li>
</ul>`, false);
}

function basePage(n) {
  const sc = 0.705; // 270mm × 169mm — 표 글자 14 → 7.4pt
  const pick = ITEMS.map(it => `${it.name} <b>${it.opts[0].label}</b>`).join(' · ');
  return sheet(n, 'base', `
<div class="b-head"><div><h2>기준 화면 — 견적 작성 (ORD-S01)</h2><p class="lede">항목마다 첫 보기를 모은 화면입니다: ${pick}. 3~11쪽은 모두 이 화면에서 한 가지만 바꿉니다.</p></div>
<ul class="ord">${ORD.map(([id, t]) => `<li><b>${id}</b>${t}</li>`).join('')}</ul></div>
<figure class="b-fig">${frame(mock(BASE, { badges: true }), 1440, 900, sc)}</figure>`);
}

function itemPage(it, i, n) {
  const lay = it.pr.lay;
  const cols = it.opts.map((o, j) => {
    const s = stateFor(it, o.v);
    const oo = { marks: j ? it.zones : [], lines: it.line ? it.zones : [] };
    const pick = `<span class="o-pick">${cb}이게 좋다</span>`;
    const stat = it.count ? `<span class="o-stat" data-count="${it.k}=${o.v}"></span>` : '';
    const cap = `<div class="o-cap"><b>${o.label}</b>${j ? '' : '<em class="tag">기준</em>'}${o.note ? `<span class="o-note">${o.note}</span>` : ''}${lay === 'lum' ? pick : ''}</div>`;
    if (lay === 'rows') return `<div class="o-row"><div class="o-side">${cap}${stat}${pick}</div>${cropBox(s, oo, it.pr.rects)}<figure class="o-thumb">${thumbBox(s, oo, it.pr.rects, 58)}<figcaption>전체 화면</figcaption></figure></div>`;
    if (lay === 'lum') return `<div class="o-col">${cap}<figure class="o-full">${thumbBox(s, oo, it.pr.rects, 118)}</figure>${cropBox(s, oo, it.pr.rects)}</div>`;
    return `<div class="o-col">${cap}${cropBox(s, oo, it.pr.rects)}<div class="o-bot"><figure class="o-thumb">${thumbBox(s, oo, it.pr.rects, THUMB)}<figcaption>전체 화면 · 검은 테두리 = 위 그림 자리</figcaption></figure><div class="o-side">${stat}${pick}</div></div></div>`;
  }).join('');
  const body = lay === 'rows' ? `<div class="i-rows">${cols}</div>` : `<div class="i-cols c${it.opts.length}">${cols}</div>`;
  const tail = lay === 'lum' ? '화면 전체가 바뀌어서 노란 칸은 달지 않았습니다.' : '바꾼 것은 이 항목 하나뿐이고, 나머지는 2쪽 기준 화면 그대로입니다.';
  return sheet(n, 'item', `<div class="i-head"><span class="i-no">${i + 1}</span><div><h2>${it.name}</h2><p class="lede">${it.q} ${tail}</p></div></div>${body}`);
}

function votePage(n) {
  const head = ITEMS.map((it, i) => `<th>${i + 1}. ${it.name}</th>`).join('');
  const cell = ITEMS.map(it => `<td class="vo">${it.opts.map(o => `<span>${ro}${o.short || o.label}</span>`).join('')}</td>`).join('');
  return sheet(n, 'vote', `
<div class="a-head"><h2>고르기 표 — 한 분씩 적어 주세요</h2>
<p class="lede">항목마다 마음에 드는 보기 하나에 표시해 주세요. 기준(첫 보기)이 좋으면 기준에. 섞으면 어울리지 않을 수 있어서, 다 고른 뒤 화면의 '고른 것 합쳐 보기' 로 같이 확인합니다.</p></div>
<table class="t vote"><colgroup><col style="width:21mm">${ITEMS.map(() => '<col>').join('')}<col style="width:33mm"></colgroup>
<thead><tr><th>이름<small>역할</small></th>${head}<th>메모<small>섞어 보니 어색한 곳 등</small></th></tr></thead>
<tbody>${`<tr><td></td>${cell}<td></td></tr>`.repeat(8)}</tbody></table>
<div class="wrap-up"><b>정리 (진행자)</b><span>많이 고른 보기</span><span>합쳐 본 화면 — 그대로 · 다시</span><span>다시 볼 항목</span><span>날짜</span></div>`, false);
}

function buildPages() {
  $('pages').innerHTML = [coverPage(), basePage(2), ...ITEMS.map((it, i) => itemPage(it, i, i + 3)), votePage(PAGES)].join('');
}
function fillCounts() {
  document.querySelectorAll('[data-count]').forEach(el => {
    const [k, v] = el.dataset.count.split('=');
    el.textContent = rowsText(visibleRows(stateFor(itemOf(k), v)));
  });
}

// ── 바꿔 보기 ───────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const ui = { mode: 'one', focus: null, picks: { ...BASE }, keep: false, badges: true, fit: true, drawer: false, phone: false };
let liveUi = null;
let flashT = 0, noteT = 0;

// 지금 그림에 보일 보기 — 한 가지씩이면 지금 고른 항목 하나만, 합쳐 보기면 고른 것 전부
function shown() {
  if (ui.mode === 'all') return { ...ui.picks };
  return ui.focus ? { ...BASE, [ui.focus]: ui.picks[ui.focus] } : { ...BASE };
}
const changed = s => ITEMS.filter(it => s[it.k] !== BASE[it.k]);
const zonesOf = s => changed(s).flatMap(it => it.zones);
// 색 · 표처럼 바탕을 보고 고르는 항목(line)은 테두리만 (다른 항목도 같은 자리를 바꿨으면 바탕까지)
const linesOf = s => { const d = changed(s); return d.filter(it => it.line).flatMap(it => it.zones).filter(zn => !d.some(it => !it.line && it.zones.includes(zn))); };

function buildCtl() {
  $('items').innerHTML = ITEMS.map((it, i) => `<li class="it" data-item="${it.k}">
<div class="it-h"><span class="it-n">${i + 1}</span><b>${it.name}</b><small>기준 ${it.opts[0].btn || it.opts[0].label}</small></div>
<div class="seg" role="group" aria-label="${it.name}" style="grid-template-columns:repeat(${it.opts.length},minmax(0,1fr))">${it.opts.map(o => `<button type="button" data-k="${it.k}" data-v="${o.v}" title="${o.label}${o.note ? ' — ' + o.note : ''}">${o.btn || o.label}</button>`).join('')}</div></li>`).join('');
}

function setMarks(zones, lines = []) {
  liveUi.querySelectorAll('[data-z]').forEach(el => { el.classList.toggle('mk', zones.includes(el.dataset.z)); el.classList.toggle('line', lines.includes(el.dataset.z)); });
}
function flash() {
  clearTimeout(flashT);
  setMarks(zonesOf(shown()), linesOf(shown()));
  if (!ui.keep) flashT = setTimeout(() => setMarks([]), 1600);
}

function paint() {
  const s = shown();
  for (const it of ITEMS) liveUi.dataset[it.k] = s[it.k];
  liveUi.dataset.badges = ui.badges ? 'on' : 'off';
  // 휴대폰 폭에서는 왼쪽 메뉴가 접혀 있다 — 메뉴 항목을 볼 때만 열어 보인다
  liveUi.dataset.drawer = ui.phone && (ui.drawer || (ui.mode === 'one' && ['nav', 'side'].includes(ui.focus))) ? 'open' : 'closed';
  document.querySelectorAll('.modes button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === ui.mode)));
  document.querySelectorAll('#items button[data-k]').forEach(b => {
    const { k, v } = b.dataset;
    b.setAttribute('aria-pressed', String(s[k] === v));
    b.classList.toggle('picked', ui.picks[k] === v && v !== BASE[k] && s[k] !== v);
  });
  document.querySelectorAll('#items .it').forEach(li => {
    const k = li.dataset.item;
    li.classList.toggle('cur', ui.mode === 'one' && k === ui.focus);
    li.classList.toggle('chg', s[k] !== BASE[k]);
  });
  const diff = changed(s);
  const say = it => `${it.name} <b>${optOf(it, s[it.k]).label}</b>`;
  $('said').innerHTML = ui.mode === 'all'
    ? (diff.length ? `<b>고른 것 합친 화면</b> — 기준과 다른 것 ${diff.length}가지: ${diff.map(say).join(' · ')} <span class="s">· 섞으면 어울리지 않을 수 있습니다</span>`
      : '<b>고른 것 합친 화면</b> <span class="s">— 아직 고른 것이 없어 기준 화면과 같습니다</span>')
    : (diff.length ? `<b>바뀐 것: ${diff[0].name}</b> — ${optOf(diff[0], s[diff[0].k]).label} <span class="s">(기준 ${diff[0].opts[0].label})${diff[0].zones.length ? '' : ' · 화면 전체'}</span>`
      : '<b>기준 화면</b> <span class="s">— 항목에서 보기를 하나 누르면 그 자리만 바뀝니다</span>');
  $('again').disabled = !zonesOf(s).length;
  // 줄 수 세기는 그림이 먼저 바뀐 뒤에 (누른 반응을 늦추지 않게)
  clearTimeout(noteT);
  noteT = setTimeout(() => {
    const now = visibleRows(s), base = visibleRows(BASE);
    $('note').textContent = ui.phone ? '휴대폰 폭으로 보는 중 — 왼쪽 메뉴는 ☰ 를 누르면 나옵니다. 넓은 화면에서 보면 1440 폭 그대로 보입니다.'
      : `${rowsText(now)}이 보입니다${now === base ? '' : ` (기준 ${base}줄)`}. 표의 줄에 마우스를 올리거나 칸을 눌러 보세요.`;
  }, 120);
}

// 창 폭에 맞추기 — 넓으면 1440×900 을 줄여 보이고, 좁으면(700px 아래) 휴대폰 화면으로 다시 늘어놓는다
function fitLive() {
  const stage = $('stage');
  const w = stage.clientWidth;
  ui.phone = w < 700;
  stage.classList.toggle('phone', ui.phone);
  liveUi.dataset.dev = ui.phone ? 'phone' : 'pc';
  $('fitSw').hidden = ui.phone;
  const fr = stage.firstElementChild, fi = fr.firstElementChild;
  if (ui.phone) { fr.style.width = fr.style.height = fi.style.zoom = ''; }
  else {
    const sc = ui.fit ? Math.min(1, (w - 2) / 1440) : 1;
    fr.style.width = `${(1440 * sc).toFixed(1)}px`; fr.style.height = `${(900 * sc).toFixed(1)}px`; fi.style.zoom = sc;
  }
}
function fitPages() {
  $('pages').style.zoom = Math.min(1, (document.documentElement.clientWidth - 32) / 1123).toFixed(3);
}

function bind() {
  $('items').addEventListener('click', e => {
    const b = e.target.closest('button[data-k]');
    if (!b) return;
    ui.picks[b.dataset.k] = b.dataset.v;
    if (ui.mode === 'one') ui.focus = b.dataset.k;
    ui.drawer = false;
    paint(); flash();
  });
  document.querySelector('.modes').addEventListener('click', e => {
    const b = e.target.closest('button[data-mode]');
    if (!b) return;
    ui.mode = b.dataset.mode;
    paint(); flash();
  });
  $('reset').addEventListener('click', () => { ui.picks = { ...BASE }; ui.focus = null; ui.drawer = false; paint(); setMarks([]); });
  $('again').addEventListener('click', flash);
  $('keep').addEventListener('change', e => { ui.keep = e.target.checked; ui.keep ? flash() : (clearTimeout(flashT), setMarks([])); });
  $('badges').addEventListener('change', e => { ui.badges = e.target.checked; paint(); });
  $('fit').addEventListener('change', e => { ui.fit = e.target.checked; fitLive(); });
  $('print').addEventListener('click', () => window.print());
  // 그림 안 — 칸을 누르면 그 줄 · 칸을 고른다, ☰ 는 휴대폰 폭에서 메뉴를 연다
  $('stage').addEventListener('click', e => {
    if (e.target.closest('.u-burger')) { if (ui.phone) { ui.drawer = liveUi.dataset.drawer !== 'open'; paint(); } return; }
    if (e.target.closest('.u-scrim')) { ui.drawer = false; if (['nav', 'side'].includes(ui.focus)) ui.focus = null; paint(); return; }
    const td = e.target.closest('.u-tb .u-td');
    if (!td) return;
    const tr = td.parentElement;
    liveUi.querySelectorAll('.u-tb .on').forEach(r => { r.classList.remove('on', 'mk', 'line'); r.removeAttribute('data-z'); });
    liveUi.querySelectorAll('.u-td.sel').forEach(c => c.classList.remove('sel'));
    tr.classList.add('on'); tr.dataset.z = 'sel'; td.classList.add('sel');
  });
}

function init() {
  buildCtl();
  $('measure').innerHTML = mock(BASE);
  $('stage').innerHTML = frame(mock(BASE, { badges: true, id: 'liveUi' }), 1440, 900, 1);
  liveUi = $('liveUi');
  buildPages();
  bind();
  fitLive(); fitPages(); paint(); fillCounts();
  let raf = 0;
  addEventListener('resize', () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { fitLive(); fitPages(); paint(); }); });
  // 글꼴이 늦게 오면 줄 높이가 바뀐다 — 다 온 뒤 다시 센다. 인쇄 도구는 ready 를 보고 뽑는다
  const done = () => { fitLive(); paint(); fillCounts(); document.documentElement.dataset.ready = '1'; };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(done); else done();
}
init();
</script>
</body>
</html>
